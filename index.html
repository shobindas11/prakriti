<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prakriti assessment</title>
<style>
:root{
  --paper:#FBFBF9; --ink:#16181C; --muted:#5F636B; --rule:#E3E4E0; --panel:#F3F3EF;
  --vata:#3F5D9E; --pitta:#B03A2C; --kapha:#2F6B52; --focus:#3F5D9E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.6;
}
.wrap{max-width:34rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.meta{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.75rem;line-height:1.25;font-weight:600;margin:0 0 .5rem;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600;margin:0 0 .75rem;letter-spacing:-.005em}
p{margin:0 0 1rem}
.lede{color:var(--muted);font-size:1rem;margin-bottom:1.5rem}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
.count{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.track{height:2px;background:var(--rule);margin:.6rem 0 1.75rem;position:relative}
.fill{height:2px;background:var(--ink);width:0;transition:width .25s ease}
.q{font-size:1.3rem;line-height:1.35;font-weight:600;margin:0 0 1.25rem;letter-spacing:-.005em}
button.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);
  border-radius:2px;padding:.85rem 1rem;margin:0 0 .6rem;cursor:pointer;font:inherit;color:inherit;
}
button.opt:hover{border-color:var(--ink)}
button.opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.opt .lbl{font-weight:600;display:block;line-height:1.35}
.opt .sub{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;color:var(--muted);line-height:1.5;margin-top:.3rem}
.note{background:var(--panel);padding:.85rem 1rem;margin-top:1.25rem;border-radius:2px}
.note .tag{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.75rem;color:var(--muted);letter-spacing:.04em;display:block;margin-bottom:.3rem}
.note p{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;line-height:1.55;margin:0}
.note.warn{background:#FAF2E8}
.nav{margin-top:1.5rem}
button.plain{
  background:none;border:1px solid var(--rule);border-radius:2px;padding:.5rem .9rem;
  font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;cursor:pointer;color:var(--muted);
}
button.plain:hover{border-color:var(--ink);color:var(--ink)}
button.plain:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bars{margin:1.5rem 0 2rem}
.bar{margin-bottom:1rem}
.bar .row{display:flex;justify-content:space-between;align-items:baseline;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;margin-bottom:.35rem}
.bar .name{font-weight:600}
.bar .val{color:var(--muted)}
.bar .gauge{height:8px;background:var(--rule);border-radius:1px;overflow:hidden}
.bar .gauge span{display:block;height:8px}
.verdict{font-size:1.35rem;font-weight:600;line-height:1.3;margin:0 0 1rem;letter-spacing:-.005em}
.dom{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin-bottom:1.5rem}
table{width:100%;border-collapse:collapse;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;margin:1rem 0 1.5rem}
td,th{text-align:left;padding:.4rem .5rem .4rem 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{color:var(--muted);font-weight:400}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<div id="app"><p class="lede">Loading the assessment…</p></div>
</div>
<script>
var Q=[
["Your natural body build",[["Lean and narrow","v","Bones read easily even at a normal weight. Thin wrists and ankles."],["Broad and solid","k","Looks substantial even when lean. Wide wrists, thick joints."],["Moderate and even","p","Reads neither narrow nor broad at any weight."]],"Measure your wrist at its narrowest point. Under 17cm is narrow, 17 to 19 moderate, above 19 broad. Adjust down a little if you are short, up if you are tall. The wrist carries almost no muscle or fat, so it reads skeleton directly.","Classical Ayurvedic texts describe no body build for Pitta at all. The middle option is a modern addition and it pulls results falsely toward Pitta. Only take it if neither of the others fits."],
["Weight over your adult life",[["Gains easily, comes off slowly","k","Weight arrives without much provocation and leaves reluctantly."],["Hard to put on, drops quickly","v","Bulking is a struggle. A bad fortnight and it is gone."],["Fairly stable","p","Moves predictably in proportion to what you do."]],"Two weeks of eating badly with no exercise. What does the scale actually do?","Frame and weight behaviour are separate things. A narrow frame that gains readily is common. Answer this independently of question 1."],
["Your skin, untreated",[["Warm, flushes, prone to rashes","p","Reddens easily. Breakouts, heat rash, sensitivity to sun."],["Dry, thin, roughens in cold or wind","v","Needs moisturiser to stay comfortable. Cracks at knuckles and heels."],["Thick, smooth, tends oily","k","Holds moisture on its own. Oily by mid-afternoon."]],"How your skin behaves with nothing applied to it, in ordinary weather.",null],
["Your hair",[["Thick, heavy, wavy, holds shine","k","Plenty of it. Heavy enough to be inconvenient."],["Dry, frizzy, splits or thins","v","Needs product to behave. Brittle ends."],["Fine, early greying or receding","p","Fine texture, and grey or thinning arrived early."]],"Your hair at around 25, before any current changes set in.",null],
["Your appetite",[["Irregular, varies day to day","v","Ravenous one day, uninterested the next. No reliable pattern."],["Sharp and urgent","p","Real hunger with an edge. You get irritable if a meal is late."],["Steady and mild","k","Predictable and moderate. Skipping a meal is not a crisis."]],"Lunch is three hours late. Are you unbothered, mildly aware of it, or genuinely unpleasant to be around?",null],
["After a normal meal",[["Slow and heavy, sits a long time","k","Sluggish afterwards. You would rather not move."],["Gas or bloating is common","v","Distension, wind, unpredictable from meal to meal."],["Fast, with acidity or heartburn","p","Digests quickly. Burning or reflux is familiar."]],"Ninety minutes after a full meal, how does your midsection actually feel?",null],
["Your bowel pattern",[["Loose or frequent","p","More than once a day, often soft."],["Irregular or dry","v","Constipation is familiar. Timing varies."],["Regular but slow and heavy","k","Reliable, unhurried, formed."]],"Your baseline without fibre supplements, coffee, or deliberate management.",null],
["Thirst through the day",[["Low, you often forget to drink","k","Water intake needs a reminder or a rule."],["Variable","v","Some days constant, some days barely at all."],["High, you drink frequently","p","Genuinely thirsty, regularly, on your own initiative."]],"With no water bottle in sight and nobody prompting you, do you notice thirst?",null],
["How you sweat",[["Heavily, with a strong odour","p","Soaks through. Noticeable smell."],["Little, even in heat","v","Stays fairly dry in conditions where others do not."],["Moderate and steady","k","Sweats, but unremarkably."]],"The same workout as someone of similar size. Who leaves the bigger mark on the bench?",null],
["The weather you handle worst",[["Heat and direct sun","p","Wilts, gets irritable, seeks shade and cold drinks."],["Cold, dry wind","v","Stiffens up, skin cracks, cannot get warm."],["Damp, cold and grey","k","Heavy, congested, sluggish and unmotivated."]],"Which climate makes you physically feel worst within an hour. Not which one you dislike on principle.",null],
["Your sleep",[["Deep and long, hard to wake","k","Eight hours or more if allowed, and groggy on waking."],["Light, interrupted","v","Wakes easily. Mind switches on at 3am."],["Sound but short","p","Six or seven hours and you are properly awake."]],"With no alarm, no late night and nothing on your mind, what does your body do on its own?",null],
["Your energy across a day",[["Bursts, then a crash","v","Productive in spikes. Flat between them."],["Slow to start, then steady","k","Mornings are hard. Once going, you last."],["Strong and driven","p","High output, sustained by push rather than by ease."]],"Plot a normal day. Spikes and troughs, one long slow ramp, or a strong level line?","Caffeine and a fixed work routine both distort this heavily. Answer from a free day with no schedule."],
["How you talk",[["Slow and measured, few words","k","Comfortable with silence. Speaks when there is something to say."],["Fast, plenty of it, tangents","v","Talks quickly, jumps between threads, circles back."],["Precise and direct","p","Economical and pointed. Argues a position well."]],"What would someone say about you after one conversation?",null],
["How you move and walk",[["Quick, restless, hard to sit still","v","Fidgets without noticing. Gets up mid-task. Stop-start."],["Unhurried and deliberate","k","Moves with weight. Comfortable staying put for long stretches."],["Brisk and purposeful","p","One consistent fast speed. Overtakes people without meaning to."]],"A friend spots you fifty metres ahead in a crowd. What do they recognise you by?","Years of desk-bound work train stillness into anyone. Answer from what you are like away from a desk, and from your twenties."],
["Learning and memory",[["Sharp and accurate, retains detail","p","Remembers figures, exact wording, who said what."],["Slow to take in, keeps it for years","k","Needs a second pass. Then it is permanent."],["Learns fast, forgets fast","v","Grasps it immediately. Cannot find it later."]],"Something you learned five years ago and have not touched since. Gone entirely, intact, or partial? Forgetting is more diagnostic than uptake.","If your job trains detail retention, work memory is not a clean read. Test yourself on something outside work: a language, directions, a film's plot."],
["Making decisions",[["Deliberate and slow, hard to shift after","k","Takes time to commit. Then it is settled."],["Quick and firm","p","Decides fast and acts on it."],["Changes your mind often","v","Revisits, reopens, reconsiders."]],"From the moment you know the right option to the moment you act, how long?",null],
["Your instinct with money",[["Spends on quality or the best version","p","Buying the best available feels correct, not indulgent."],["Saves and accumulates","k","Parting with money needs a reason, even when affordable."],["Spends impulsively","v","Goes quickly, without much pattern or afterthought."]],"Unplanned money arrives. Where does it go by default? And when you do buy the expensive right thing, does it feel like a justified exception or the obvious choice? Exception means saver.",null],
["Under real pressure you become",[["Irritable, critical, short-tempered","p","Fuse shortens. Focus holds or sharpens. Heat goes outward at people."],["Anxious, scattered, worried","v","Mind runs ahead to what might go wrong. Motion without traction."],["Withdrawn, shut down","k","Goes quiet, avoids, seeks comfort or sleep."]],"The first twenty minutes after bad news lands, before you have managed yourself into a response.","Professional composure is trained. Answer from what your family gets at the end of a bad week, not what colleagues see in the meeting."],
["Your emotional pattern",[["Slow to get upset, slow to let go","k","Takes a lot to provoke. Holds it a long while after."],["Shifts quickly, up and down","v","Changes fast in both directions."],["Intense while it lasts, then over","p","Burns hot, then genuinely done with it."]],"From upset to genuinely over it: hours, days, or weeks?",null],
["Your joints",[["Well-padded and stable","k","Cushioned. Bones are not prominent at knee or knuckle."],["Loose, warm, moderate","p","Flexible and unremarkable."],["Prominent, they crack and pop","v","Knees, knuckles and ankles are visible and audible."]],"Knees, knuckles, ankles. Padded and quiet, or prominent and noisy?",null]
];

var NAME={v:"Vata",p:"Pitta",k:"Kapha"};
var COLOR={v:"var(--vata)",p:"var(--pitta)",k:"var(--kapha)"};
var GLOSS={
 v:"Vata governs movement: breath, circulation, nerve impulse, and the passage of thought. Its qualities are dry, light, cold, mobile and irregular. Where it leads, you get quickness, variability and a light frame, with dryness and irregularity as the cost.",
 p:"Pitta governs transformation: digestion, metabolism, body heat, and the processing of information. Its qualities are hot, sharp, light and penetrating. Where it leads, you get intensity, precision and drive, with heat and irritability as the cost.",
 k:"Kapha governs structure: tissue, fluid, lubrication and cohesion. Its qualities are heavy, slow, cool, oily and stable. Where it leads, you get endurance, steadiness and solidity, with sluggishness and accumulation as the cost."
};
var DOMAIN={1:"structure",2:"structure",3:"structure",4:"structure",5:"metabolic",6:"metabolic",7:"metabolic",8:"metabolic",9:"metabolic",10:"metabolic",11:"mind",12:"metabolic",13:"mind",14:"mind",15:"mind",16:"mind",17:"mind",18:"mind",19:"mind",20:"structure"};

var ans=new Array(Q.length).fill(null), i=0;
var app=document.getElementById("app");

function el(tag,css,txt){var e=document.createElement(tag);if(css)e.style.cssText=css;if(txt)e.textContent=txt;return e;}

function intro(){
  app.innerHTML="";
  var h=el("h1",null,"Prakriti assessment");
  var l=el("p",null,"Twenty questions on your Ayurvedic constitution. Each one carries an explanation of what it is really asking, the single test that best separates the three answers, and a warning where everyday life distorts the reading.");
  l.className="lede";
  var l2=el("p",null,"Answer for your lifelong pattern, not the last few months. Constitution is meant to be your stable baseline; what is true of you right now is a different idea and mixing the two is the most common way these go wrong. Takes about eight minutes. Nothing is sent anywhere.");
  l2.className="lede";
  var b=el("button",null,"Start");
  b.className="plain";
  b.style.cssText="padding:.65rem 1.4rem;font-size:1rem;color:var(--ink);border-color:var(--ink)";
  b.onclick=function(){i=0;render();};
  app.appendChild(h);app.appendChild(l);app.appendChild(l2);app.appendChild(b);
}

function render(){
  app.innerHTML="";
  if(i>=Q.length){results();return;}
  var d=Q[i];
  var c=el("div",null,"Question "+(i+1)+" of "+Q.length);c.className="count";
  var t=el("div");t.className="track";
  var f=el("div");f.className="fill";f.style.width=Math.round(i/Q.length*100)+"%";
  t.appendChild(f);
  app.appendChild(c);app.appendChild(t);
  var q=el("p",null,d[0]);q.className="q";
  app.appendChild(q);
  d[1].forEach(function(o){
    var b=document.createElement("button");
    b.className="opt";
    var s1=el("span",null,o[0]);s1.className="lbl";
    var s2=el("span",null,o[2]);s2.className="sub";
    b.appendChild(s1);b.appendChild(s2);
    b.onclick=function(){ans[i]=o[1];i++;render();window.scrollTo(0,0);};
    app.appendChild(b);
  });
  var n=el("div");n.className="note";
  var tag=el("span",null,"The test");tag.className="tag";
  n.appendChild(tag);n.appendChild(el("p",null,d[2]));
  app.appendChild(n);
  if(d[3]){
    var w=el("div");w.className="note warn";
    var wt=el("span",null,"Watch out");wt.className="tag";
    w.appendChild(wt);w.appendChild(el("p",null,d[3]));
    app.appendChild(w);
  }
  var nav=el("div");nav.className="nav";
  if(i>0){
    var back=el("button",null,"Back");back.className="plain";
    back.onclick=function(){i--;render();window.scrollTo(0,0);};
    nav.appendChild(back);
  }
  app.appendChild(nav);
}

function results(){
  var c={v:0,p:0,k:0};
  ans.forEach(function(a){c[a]++;});
  var pct=function(n){return Math.round(n/Q.length*100);};
  var order=["v","p","k"].sort(function(a,b){return c[b]-c[a];});
  var top=order[0], second=order[1];
  var topPct=pct(c[top]), secPct=pct(c[second]);

  app.innerHTML="";
  app.appendChild(el("h1",null,"Your result"));

  var bars=el("div");bars.className="bars";
  order.forEach(function(d){
    var b=el("div");b.className="bar";
    var row=el("div");row.className="row";
    var nm=el("span",null,NAME[d]);nm.className="name";
    var vl=el("span",null,pct(c[d])+"%  ·  "+c[d]+" of "+Q.length);vl.className="val";
    row.appendChild(nm);row.appendChild(vl);
    var g=el("div");g.className="gauge";
    var s=el("span");s.style.cssText="width:"+pct(c[d])+"%;background:"+COLOR[d];
    g.appendChild(s);
    b.appendChild(row);b.appendChild(g);
    bars.appendChild(b);
  });
  app.appendChild(bars);

  var verdict, explain;
  if(topPct>=50){
    verdict=NAME[top]+" dominant";
    explain="One dosha cleared the fifty percent mark, which is the conventional threshold for calling it dominant. "+(secPct>=25?NAME[second]+" sits in the secondary band, so the full reading is "+NAME[top]+"-"+NAME[second]+".":"Nothing else reached the secondary band, so this is a relatively single-type result, which is uncommon.");
  } else if(topPct-secPct<=10){
    verdict=NAME[top]+"-"+NAME[second]+", closely split";
    explain="No dosha cleared fifty percent, so strictly speaking you have no dominant type. The top two are within two questions of each other, which means a single different answer would reorder them. Treat the ranking as provisional and the pairing as the real finding. Most people are dual-dosha.";
  } else {
    verdict=NAME[top]+" leading, "+NAME[second]+" secondary";
    explain="No dosha cleared fifty percent, so this is a dual-type result rather than a dominant one. "+NAME[top]+" leads clearly enough to be meaningful, with "+NAME[second]+" behind it. Most people land here.";
  }
  var v=el("p",null,verdict);v.className="verdict";
  app.appendChild(v);
  app.appendChild(el("p",null,explain));
  app.appendChild(el("p",null,GLOSS[top]));
  if(secPct>=25) app.appendChild(el("p",null,GLOSS[second]));

  var dom={structure:{v:0,p:0,k:0},metabolic:{v:0,p:0,k:0},mind:{v:0,p:0,k:0}};
  ans.forEach(function(a,n){dom[DOMAIN[n+1]][a]++;});
  var lead=function(o){var ks=Object.keys(o).sort(function(a,b){return o[b]-o[a];});return o[ks[0]]===o[ks[1]]?"mixed":NAME[ks[0]];};

  app.appendChild(document.createElement("hr"));
  app.appendChild(el("h2",null,"Where your answers clustered"));
  app.appendChild(el("p",null,"This matters more than the totals. Answers that group cleanly by domain mean something; answers that scatter evenly mean the questionnaire is not discriminating well for you."));
  var tbl=document.createElement("table");
  tbl.innerHTML="<tr><th>Domain</th><th>Leaning</th><th>Split</th></tr>";
  [["Structure: frame, skin, hair, joints","structure"],["Metabolic: appetite, digestion, sleep, heat","metabolic"],["Mind: speech, memory, decisions, stress","mind"]].forEach(function(r){
    var o=dom[r[1]];
    var tr=document.createElement("tr");
    tr.innerHTML="<td>"+r[0]+"</td><td>"+lead(o)+"</td><td>V"+o.v+" P"+o.p+" K"+o.k+"</td>";
    tbl.appendChild(tr);
  });
  app.appendChild(tbl);
  app.appendChild(el("p",null,"Structural markers carry the most weight in classical assessment, because frame, skin and joints do not change with your job or your last six months. Metabolic answers are the least reliable: appetite, digestion and energy shift with work, stress, sleep and diet. If your structural and metabolic columns disagree, trust the structural one for constitution, and read the metabolic column as current state rather than baseline."));

  app.appendChild(document.createElement("hr"));
  app.appendChild(el("h2",null,"How much to trust this"));
  app.appendChild(el("p",null,"Less than the confident presentation of any online dosha quiz suggests. Reviews of prakriti assessment tools find that most lack proper psychometric validation, that machine-learning approaches struggle with accuracy and replicability, and that even device-based methods have not been adequately validated. The better instruments do show decent test-retest reliability, but reliability only means the tool agrees with itself, not that the result predicts anything about your health."));
  app.appendChild(el("p",null,"Useful as a vocabulary for patterns you already recognise in yourself. Not a basis for medical decisions, and not a substitute for a qualified practitioner, who would assess by examination and questioning rather than a form. If a recommendation that follows from your result would mean changing medication, ignoring a symptom, or eliminating a food group, check with a doctor first."));

  app.appendChild(document.createElement("hr"));
  var again=el("button",null,"Take it again");again.className="plain";
  again.onclick=function(){ans=new Array(Q.length).fill(null);i=0;render();window.scrollTo(0,0);};
  app.appendChild(again);
  var copy=el("button",null,"Copy my answers");copy.className="plain";
  copy.style.marginLeft=".5rem";
  copy.onclick=function(){
    var txt="Prakriti result — Vata "+c.v+"/"+Q.length+" ("+pct(c.v)+"%), Pitta "+c.p+"/"+Q.length+" ("+pct(c.p)+"%), Kapha "+c.k+"/"+Q.length+" ("+pct(c.k)+"%). By question: "+ans.map(function(a,n){return (n+1)+":"+NAME[a];}).join(", ");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){copy.textContent="Copied";},function(){window.prompt("Copy this:",txt);});}
    else{window.prompt("Copy this:",txt);}
  };
  app.appendChild(copy);
  window.scrollTo(0,0);
}

intro();
</script>
</body>
</html>
