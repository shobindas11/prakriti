<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prakriti assessment</title>
<style>
:root{
  --paper:#FBFBF9; --ink:#16181C; --muted:#5F636B; --rule:#E3E4E0; --panel:#F3F3EF;
  --vata:#3F5D9E; --pitta:#B03A2C; --kapha:#2F6B52; --focus:#3F5D9E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  font-size:17px; line-height:1.6;
}
.wrap{max-width:34rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
h1{font-size:1.75rem;line-height:1.25;font-weight:600;margin:0 0 .5rem;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:600;margin:0 0 .75rem;letter-spacing:-.005em}
p{margin:0 0 1rem}
.lede{color:var(--muted);font-size:1rem;margin-bottom:1.5rem}
hr{border:0;border-top:1px solid var(--rule);margin:2rem 0}
.count{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.8rem;color:var(--muted);letter-spacing:.02em}
.track{height:2px;background:var(--rule);margin:.6rem 0 1.75rem}
.fill{height:2px;background:var(--ink);width:0;transition:width .25s ease}
.q{font-size:1.3rem;line-height:1.35;font-weight:600;margin:0 0 1.25rem;letter-spacing:-.005em}
button.opt{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);
  border-radius:2px;padding:.85rem 1rem;margin:0 0 .6rem;cursor:pointer;font:inherit;color:inherit;
}
button.opt:hover{border-color:var(--ink)}
button.opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.opt .lbl{font-weight:600;display:block;line-height:1.35}
.opt .sub{display:block;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;color:var(--muted);line-height:1.5;margin-top:.3rem}
button.none{background:none;border-style:dashed;margin-top:.9rem}
button.none .lbl{font-weight:400;color:var(--muted);font-size:.95rem}
.note{background:var(--panel);padding:.85rem 1rem;margin-top:1.25rem;border-radius:2px}
.note .tag{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.75rem;color:var(--muted);letter-spacing:.04em;display:block;margin-bottom:.3rem}
.note p{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;line-height:1.55;margin:0}
.note.warn{background:#FAF2E8}
.nav{margin-top:1.5rem}
button.plain{
  background:none;border:1px solid var(--rule);border-radius:2px;padding:.5rem .9rem;
  font-family:ui-sans-serif,system-ui,sans-serif;font-size:.9rem;cursor:pointer;color:var(--muted);
}
button.plain:hover{border-color:var(--ink);color:var(--ink)}
button.plain:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.verdict{font-size:2.1rem;font-weight:600;line-height:1.12;margin:2.25rem 0 1rem;letter-spacing:-.022em}
.stack{display:flex;height:14px;overflow:hidden;margin:0 0 .75rem}
.stack span{display:block;height:14px}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1.5rem;font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;margin-bottom:1.75rem}
.legend div{display:flex;align-items:center;gap:.45rem}
.legend i{width:9px;height:9px;flex:none;display:inline-block}
.legend b{font-weight:600}
.legend em{font-style:normal;color:var(--muted)}
.skip{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;color:var(--muted);margin-bottom:2rem}
.dcard{border-top:2px solid var(--ink);padding-top:.65rem;margin-bottom:1.75rem}
.dcard h3{font-size:1.15rem;font-weight:600;margin:0 0 .45rem;letter-spacing:-.005em}
.dcard p{margin:0}
.kicker{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.78rem;color:var(--muted);margin:0 0 .15rem;letter-spacing:.03em}
.drow{padding:1rem 0;border-bottom:1px solid var(--rule)}
.drow:first-of-type{border-top:1px solid var(--rule)}
.drow .top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.drow .dname{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.85rem;color:var(--muted);line-height:1.4}
.drow .dlead{font-weight:600;font-size:1.05rem;white-space:nowrap}
.drow .dbar{display:flex;height:5px;overflow:hidden;margin-top:.6rem}
.drow .dbar span{display:block;height:5px}
.foot{font-family:ui-sans-serif,system-ui,sans-serif;font-size:.83rem;color:var(--muted);line-height:1.6;margin-top:2rem}
.foot summary{cursor:pointer;padding:.3rem 0}
.foot p{font-size:.83rem;margin:.6rem 0 0}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap"><div id="app"><p class="lede">Loading…</p></div></div>
<script>
var Q=[
["Your natural body build",[["Lean and narrow","v","Bones read easily even at a normal weight. Wrists and ankles look fine-boned."],["Broad and solid","k","Looks substantial even when lean. Wide wrists, thick joints."],["Moderate and even","p","Neither narrow nor broad at any weight you have carried."]],"Genuinely cannot tell, my weight has always masked my frame","Measure your wrist at its narrowest point, below the wrist bone. Under 17cm reads narrow, 17 to 19 moderate, above 19 broad, adjusted up if you are tall. The wrist carries almost no muscle or fat, so it reads skeleton directly.","Classical texts describe no body build for Pitta at all. The middle option is a modern addition and it pulls results falsely toward Pitta. If the wrist measurement puts you in a band, trust that over your impression.","s"],
["Weight across your adult life",[["Gains easily, comes off slowly","k","Weight arrives without much provocation and leaves reluctantly."],["Hard to put on, drops quickly","v","Deliberate bulking is a struggle. A bad fortnight and it is gone."],["Stable, moves in proportion to effort","p","Predictable in both directions, roughly matching what you do."]],"My weight has never varied enough for me to know","Picture two weeks of eating badly with no exercise, then two weeks of eating well. Which direction moves faster? Easy up and slow down is Kapha, easy down and slow up is Vata, symmetrical is the middle option.","Frame and weight behaviour are separate things, and a narrow frame that gains readily is common. Ignore your answer to question 1 when you answer this one.","s"],
["Your skin to the touch",[["Warm and soft, colour rises easily","p","Runs hot under the hand. Flushes and marks quickly."],["Dry and fine, slightly rough","v","Cool to touch. Loses moisture fast, roughens at knuckles and heels."],["Cool and thick, slightly oily","k","Substantial under the hand. Holds its own moisture."]],"None of these, my skin is unremarkable either way","Press the back of your hand against your cheek and forearm, on skin with nothing applied to it. You are judging two things only: temperature and oiliness. Warm decides it for the first option; if not warm, oily or dry decides between the other two.","Recent sun, shaving, active skincare and cold weather all change this for days at a time. Answer from your skin over the last year, not this week.","s"],
["Your hair's texture",[["Thick and heavy, holds shine","k","Enough of it to be inconvenient. Lies heavy."],["Dry and fine, frizzes or splits","v","Needs product to behave. Brittle at the ends."],["Fine and soft, neither dry nor heavy","p","Light and silky. No particular tendency to frizz or weight."]],"Ordinary, nothing distinctive about it","Judge texture and weight only, with nothing in it. Hair volume in your twenties is the cleanest reading.","Greying and thinning are strongly genetic and only loosely constitutional, so they are deliberately left out of the options here. Do not let early grey pull you toward an answer.","s"],
["Your eyes",[["Large and moist, thick lashes","k","Prominent. Rarely feel dry."],["Small and on the dry side","v","Less prominent. Dry out readily, especially in wind or air conditioning."],["Medium, bright, with a direct gaze","p","Neither large nor small. Notably sharp-looking."]],"Nothing about them stands out","Look in a mirror in daylight. You are judging size relative to your face, and how readily they dry out.","If size and moisture point to different answers, go by moisture, and discount this question if you wear contact lenses, which dry the eyes regardless of constitution.","s"],
["Your fingernails",[["Thick and strong, resist splitting","k","Grow evenly. Hard to break."],["Brittle and ridged, split or peel","v","Ridged lengthwise. Break before they get long."],["Soft, they bend rather than break","p","Pliable, with a pink bed. Grow quickly."]],"Nothing notable about them","Look at your own nails now, without polish or gels. The distinction is how they fail: splitting is Vata, bending is Pitta, not failing is Kapha.","Manicures, gel treatments, biotin supplements and frequent hand-washing all change nail quality substantially. Answer from an untreated stretch if you can remember one.","s"],
["Your joints",[["Well-padded and stable","k","Cushioned. Bones not prominent at knee or knuckle."],["Loose, warm, freely mobile","p","Move easily. Unremarkable to look at."],["Prominent, they crack and pop","v","Knees, knuckles and ankles are both visible and audible."]],"Nothing notable about them","Look at your knuckles and knees with the joint straight, and listen when you stand up from sitting. Visible and noisy is Vata; padded and quiet is Kapha.","Injury history and low body fat both make joints look more prominent than the frame warrants. Answer from your joints at a normal weight and on the uninjured side.","s"],
["Your appetite",[["Irregular, varies day to day","v","Ravenous one day, uninterested the next, with no pattern to it."],["Sharp and strong, comes on urgently","p","Real hunger with an edge. Difficult to postpone."],["Mild and steady, easy to postpone","k","Moderate and predictable. Skipping is no crisis."]],"Reliable and moderate, neither sharp nor sluggish","Lunch is three hours late and you cannot do anything about it. Unbothered is Kapha, mildly aware is the fourth option, genuinely unpleasant to be around is Pitta, and wildly variable depending on the day is Vata.","The framework treats reliable, moderate appetite as balance rather than as any dosha, so the fourth option here is a real finding and not a dodge.","m"],
["Your digestive power",[["Fast and strong, food clears quickly","p","Efficient. Hungry again on schedule."],["Variable, unpredictable meal to meal","v","The same food does different things on different days."],["Slow and heavy, sits a long time","k","Sluggish afterwards. You would rather not move."]],"Steady and comfortable, no pattern stands out","Judge speed and consistency after a plain, simple meal. How long until you feel empty again, and does that time hold steady across days? Fast and consistent is Pitta even with no discomfort at all.","Burning, bloating and reflux are signs of imbalance rather than constitution, and they move with diet, stress and sleep. Do not use symptoms to answer this one.","m"],
["Your bowel pattern",[["Soft and fast, more than once a day","p","Quick transit. Loose more often than formed."],["Dry or irregular, timing varies","v","No reliable schedule. Constipation is familiar."],["Formed but slow and heavy","k","Reliable, unhurried, takes some effort."]],"Effortless and regular, neither slow nor rushed","Judge frequency and consistency at your baseline, with no fibre supplements, no coffee first thing, and no deliberate management.","Travel, antibiotics and a recent change in diet all override this for weeks. Answer from a settled period at home.","m"],
["Thirst through the day",[["Low, you forget to drink","k","Water needs a reminder or a rule to happen."],["Variable","v","Some days constant, some days barely at all."],["High, you drink frequently","p","Genuinely thirsty, regularly, unprompted."]],"Moderate and consistent","With no bottle in front of you and nobody prompting you, does thirst reach you on its own?","Climate dominates this. A Gulf summer, an air-conditioned office and a cold country produce completely different answers from the same person. Answer from the climate you have lived in longest.","m"],
["How you sweat",[["Readily and heavily, with strong odour","p","Starts early in a session and soaks through."],["Little, even in heat","v","Stays dry where others do not."],["Slow to start, then persistent","k","Takes real exertion to begin, then keeps going afterwards."]],"Average, nothing notable","Two things: how soon sweating starts once you exert yourself, and how strong the odour is. Early plus strong odour is Pitta; late but long-lasting is Kapha; barely at all is Vata.","Fitness level changes this more than constitution does, because trained people sweat sooner and more freely. If your fitness has swung a lot, answer from your least trained period, and mark it as not fitting if you cannot separate the two.","m"],
["The climate you handle worst",[["Heat and direct sun","p","Wilts, gets irritable, seeks shade within minutes."],["Cold, dry wind","v","Stiffens, skin cracks, cannot get warm again."],["Damp, cold and grey","k","Heavy, congested, unmotivated."]],"I handle all three about equally","Which one makes you physically feel worst within an hour of being in it. Not which one you dislike in principle, and not which one you would rather holiday in.",null,"m"],
["Your sleep, left to itself",[["Deep and long, hard to wake","k","Eight hours or more if allowed. Groggy on waking."],["Light and interrupted","v","Wakes at small disturbances. Mind switches on at 3am."],["Sound but short","p","Six or seven hours and you are properly awake."]],"Normal length, wake easily, nothing notable","Judge two things: how long you sleep with no alarm, and how easily you are disturbed. Long and hard to wake is Kapha; short and sharp is Pitta; easily broken is Vata regardless of length.","Caffeine after midday, screens late, shift work and young children all override constitution completely. Answer from a stretch without those, such as the second week of a holiday.","m"],
["Your energy across a day",[["Bursts, then a crash","v","Productive in spikes, flat in between."],["Slow to start, then steady","k","Mornings are hard. Once going, you last."],["Strong and driven throughout","p","High output, held up by push rather than ease."]],"Even throughout, no real pattern","Plot a free day with no schedule and no caffeine. Are there spikes and troughs, one slow ramp upward, or a level line?","Caffeine timing and a fixed work routine both manufacture an energy curve that is not yours. A weekend with nothing planned is the cleanest test.","b"],
["How you talk",[["Slow and measured, few words","k","Comfortable with silence. Speaks when there is something to say."],["Fast, plenty of it, with tangents","v","Jumps between threads and circles back."],["Precise and direct","p","Economical and pointed. Argues a position well."]],"Middling, nobody would remark on it","You cannot hear your own speech pace from outside, so ask someone who knows you well, or listen back to a voice note you sent without thinking about it.","Speaking a second language makes anyone sound slower and sparser than they are. Answer from how you speak in the language you think in.","b"],
["How you move and walk",[["Quick and restless, hard to sit still","v","Fidgets without noticing. Gets up mid-task."],["Unhurried and deliberate","k","Moves with weight. Content to stay put for long stretches."],["Brisk and purposeful","p","One fast, consistent speed with somewhere to be."]],"Nothing distinctive about it","Ask someone how they would spot you from fifty metres away in a crowd, or watch yourself in a video you did not know was being taken.","Years of desk-bound work train stillness into anyone, so current sitting tolerance is about your job. Answer from what you are like away from a desk, and from your twenties.","b"],
["Learning and memory",[["Sharp and accurate, retains detail","p","Figures, exact wording, who said what and when."],["Slow to take in, then keeps it for years","k","Needs a second pass. After that it is permanent."],["Fast in, fast out","v","Grasps it immediately, cannot find it later."]],"Average, takes normal effort and fades normally","Pick something you learned five years ago and have not touched since. Gone, intact, or partial? Forgetting is far more diagnostic than how fast you took it in, because everyone overrates their own uptake.","If your job trains detail retention, work memory is not a clean read. Test yourself on something outside work: a language, directions to a place, the plot of a film.","b"],
["Making decisions",[["Deliberate and slow, settled once made","k","Takes time to commit. Then it holds."],["Quick and firm","p","Decides fast and acts on it."],["Revisits and changes your mind","v","Reopens and reconsiders after deciding."]],"Depends entirely on the stakes, no consistent pattern","Time the gap between knowing the right option and actually acting on it, on a decision of ordinary size. Then ask how often you reopen it afterwards.","Decisions you make for other people, at work or for family, follow professional habit rather than instinct. Answer from decisions that affect only you.","b"],
["Under real pressure you become",[["Irritable, critical, short-tempered","p","Fuse shortens, focus holds. The heat goes outward at people."],["Anxious, scattered, worried","v","Mind runs ahead to what might go wrong. Motion without traction."],["Withdrawn, you shut down","k","Goes quiet, avoids it, seeks comfort or sleep."]],"None of these, I stay fairly level","The first twenty minutes after bad news lands, before you have managed yourself into a response. That initial reaction is the constitutional one; what you do afterwards is character.","Professional composure is trained and colleagues rarely see the real thing. Answer from what your household gets at the end of a bad week.","b"],
["Your emotional pattern",[["Slow to upset, slow to let go","k","Takes a lot to provoke, then holds it a long while."],["Shifts quickly, in both directions","v","Changes fast, up and down."],["Intense while it lasts, then over","p","Burns hot, then genuinely finished with it."]],"Even-tempered, nothing pronounced","Time it rather than rating it. From upset to genuinely over it: hours, days, or weeks? Duration separates these three better than intensity does.",null,"b"]
];
var NAME={v:"Vata",p:"Pitta",k:"Kapha"};
var COLOR={v:"var(--vata)",p:"var(--pitta)",k:"var(--kapha)"};
var GLOSS={
 v:"Vata governs movement: breath, circulation, nerve impulse, the passage of thought. Dry, light, cold, mobile, irregular. Quickness and variability are its gifts; dryness and irregularity are its cost.",
 p:"Pitta governs transformation: digestion, metabolism, body heat, the processing of information. Hot, sharp, light, penetrating. Intensity and precision are its gifts; heat and irritability are its cost.",
 k:"Kapha governs structure: tissue, fluid, lubrication, cohesion. Heavy, slow, cool, oily, stable. Endurance and steadiness are its gifts; sluggishness and accumulation are its cost."
};
var DOMNAME={s:"Structure: build, skin, hair, eyes, teeth, joints",m:"Metabolic: appetite, digestion, thirst, sleep, heat",b:"Mind and behaviour: speech, memory, decisions, stress"};
var ans=new Array(Q.length).fill(undefined), i=0;
var app=document.getElementById("app");
function el(t,c,x){var e=document.createElement(t);if(c)e.style.cssText=c;if(x)e.textContent=x;return e;}
function intro(){
  app.innerHTML="";
  app.appendChild(el("h1",null,"Prakriti assessment"));
  var a=el("p",null,"Twenty-one questions on your Ayurvedic constitution. Each carries an explanation of what it is actually measuring, the test that best separates the answers, and a warning where ordinary life distorts the reading.");a.className="lede";
  var b=el("p",null,"Every question has a fourth option for when none of the three genuinely fits. Taking it is not a failure. Those answers are excluded from the scoring rather than guessed at, and how often you use it is reported back to you as a measure of how well the instrument fitted.");b.className="lede";
  var c=el("p",null,"Answer for your lifelong pattern, not the last few months. Constitution is meant to be your stable baseline. About eight minutes. Nothing is sent anywhere.");c.className="lede";
  var s=el("button",null,"Start");s.className="plain";s.style.cssText="padding:.65rem 1.4rem;font-size:1rem;color:var(--ink);border-color:var(--ink)";
  s.onclick=function(){i=0;render();};
  app.appendChild(a);app.appendChild(b);app.appendChild(c);app.appendChild(s);
}
function render(){
  app.innerHTML="";
  if(i>=Q.length){results();return;}
  var d=Q[i];
  var c=el("div",null,"Question "+(i+1)+" of "+Q.length);c.className="count";
  var t=el("div");t.className="track";
  var f=el("div");f.className="fill";f.style.width=Math.round(i/Q.length*100)+"%";t.appendChild(f);
  app.appendChild(c);app.appendChild(t);
  var q=el("p",null,d[0]);q.className="q";app.appendChild(q);
  var n=el("div");n.className="note";n.style.margin="0 0 1.1rem";
  var tg=el("span",null,"How to decide");tg.className="tag";n.appendChild(tg);n.appendChild(el("p",null,d[3]));
  app.appendChild(n);
  if(d[4]){var w=el("div");w.className="note warn";w.style.margin="0 0 1.25rem";var wt=el("span",null,"Watch out");wt.className="tag";w.appendChild(wt);w.appendChild(el("p",null,d[4]));app.appendChild(w);}
  function mk(label,sub,val,isNone){
    var b=document.createElement("button");b.className="opt"+(isNone?" none":"");
    var s1=el("span",null,label);s1.className="lbl";b.appendChild(s1);
    if(sub){var s2=el("span",null,sub);s2.className="sub";b.appendChild(s2);}
    b.onclick=function(){ans[i]=val;i++;render();window.scrollTo(0,0);};
    return b;
  }
  d[1].forEach(function(o){app.appendChild(mk(o[0],o[2],o[1],false));});
  app.appendChild(mk(d[2],null,null,true));
  var nav=el("div");nav.className="nav";
  if(i>0){var bk=el("button",null,"Back");bk.className="plain";bk.onclick=function(){i--;render();window.scrollTo(0,0);};nav.appendChild(bk);}
  app.appendChild(nav);
}
function results(){
  var c={v:0,p:0,k:0}, skipped=0;
  ans.forEach(function(a){if(a===null){skipped++;}else{c[a]++;}});
  var N=Q.length-skipped;
  var pct=function(n){return N?Math.round(n/N*100):0;};
  var order=["v","p","k"].sort(function(a,b){return c[b]-c[a];});
  var top=order[0],second=order[1],topPct=pct(c[top]),secPct=pct(c[second]);
  app.innerHTML="";
  var verdict,explain;
  if(N===0){verdict="No result";explain="Nothing was scored.";}
  else if(topPct>=50){
    verdict=NAME[top]+" dominant";
    explain="One dosha cleared fifty percent of your scored answers, the conventional threshold for dominance. "+(secPct>=25?NAME[second]+" sits in the secondary band, so the full reading is "+NAME[top]+"-"+NAME[second]+".":"Nothing else reached the secondary band, making this a relatively single-type result, which is uncommon.");
  } else if(topPct-secPct<=10){
    verdict=NAME[top]+" and "+NAME[second]+", closely split";
    explain="No dosha cleared fifty percent, and the top two are close enough that a single different answer would reorder them. Treat the ranking as provisional and the pairing as the finding. Most people are dual-dosha.";
  } else {
    verdict=NAME[top]+" leading, "+NAME[second]+" secondary";
    explain="No dosha cleared fifty percent, so this is a dual-type result rather than a dominant one. "+NAME[top]+" leads clearly enough to mean something, with "+NAME[second]+" behind it.";
  }
  if(N<Math.ceil(Q.length*0.6)){
    var lo=el("div");lo.className="note warn";lo.style.marginTop="1.5rem";
    var lt=el("span",null,"Low confidence");lt.className="tag";lo.appendChild(lt);
    lo.appendChild(el("p",null,"You marked "+skipped+" of "+Q.length+" questions as not fitting, leaving only "+N+" scored. That is too few to read as a constitutional type. It may mean a genuinely balanced constitution, or simply that this instrument does not fit you. Treat what follows as indicative at best."));
    app.appendChild(lo);
  }
  var v=el("p",null,verdict);v.className="verdict";app.appendChild(v);
  var st=el("div");st.className="stack";
  order.forEach(function(d){if(c[d]>0){var s=el("span");s.style.cssText="width:"+pct(c[d])+"%;background:"+COLOR[d];st.appendChild(s);}});
  if(N>0)app.appendChild(st);
  var lg=el("div");lg.className="legend";
  order.forEach(function(d){
    var it=el("div");
    var sw=document.createElement("i");sw.style.background=COLOR[d];
    it.appendChild(sw);it.appendChild(el("b",null,NAME[d]));it.appendChild(el("em",null,pct(c[d])+"%"));
    lg.appendChild(it);
  });
  if(N>0)app.appendChild(lg);
  app.appendChild(el("p",null,explain));
  var sk=el("p",null,skipped===0?"All "+Q.length+" questions gave a clear signal, so the whole instrument sits behind this.":skipped+" question"+(skipped===1?" was":"s were")+" marked as not fitting and left out of the scoring. Percentages are of the "+N+" scored, not of "+Q.length+".");
  sk.className="skip";app.appendChild(sk);
  if(N>0){
    var card=function(d,role){
      var k=el("div");k.className="dcard";k.style.borderTopColor=COLOR[d];
      var kick=el("p",null,role);kick.className="kicker";k.appendChild(kick);
      k.appendChild(el("h3",null,NAME[d]));
      k.appendChild(el("p",null,GLOSS[d]));
      return k;
    };
    app.appendChild(card(top,"Leading"));
    if(secPct>=25)app.appendChild(card(second,"Secondary"));
  }
  var dom={s:{v:0,p:0,k:0,n:0},m:{v:0,p:0,k:0,n:0},b:{v:0,p:0,k:0,n:0}};
  ans.forEach(function(a,n){var g=dom[Q[n][5]];if(a===null){g.n++;}else{g[a]++;}});
  var lead=function(o){var ks=["v","p","k"].sort(function(a,b){return o[b]-o[a];});if(o[ks[0]]===0)return "no signal";return o[ks[0]]===o[ks[1]]?"mixed":NAME[ks[0]];};
  app.appendChild(document.createElement("hr"));
  app.appendChild(el("h2",null,"Where your answers clustered"));
  app.appendChild(el("p",null,"This matters more than the totals. Seven questions sit in each domain, so they carry equal weight by construction. Answers that group cleanly within a domain mean something; answers that scatter evenly mean the instrument is not discriminating well for you."));
  ["s","m","b"].forEach(function(k){
    var o=dom[k],scored=o.v+o.p+o.k;
    var row=el("div");row.className="drow";
    var t=el("div");t.className="top";
    var nm=el("span",null,DOMNAME[k]);nm.className="dname";
    var ld=el("span",null,lead(o));ld.className="dlead";
    t.appendChild(nm);t.appendChild(ld);row.appendChild(t);
    var db=el("div");db.className="dbar";
    if(scored){["v","p","k"].forEach(function(d){if(o[d]>0){var s=el("span");s.style.cssText="width:"+Math.round(o[d]/scored*100)+"%;background:"+COLOR[d];db.appendChild(s);}});}
    else{var s0=el("span");s0.style.cssText="width:100%;background:var(--rule)";db.appendChild(s0);}
    row.appendChild(db);
    app.appendChild(row);
  });
  var dn=el("p",null,"Structural markers carry the most weight in classical assessment, because build, skin, eyes, teeth and joints do not change with your job or your last six months. Metabolic answers are the least reliable, shifting with work, stress, sleep and diet. If your structural and metabolic rows disagree, trust the structural one for constitution and read the metabolic row as your current state instead.");
  dn.style.marginTop="1.5rem";app.appendChild(dn);
  app.appendChild(document.createElement("hr"));
  var again=el("button",null,"Take it again");again.className="plain";
  again.onclick=function(){ans=new Array(Q.length).fill(undefined);i=0;render();window.scrollTo(0,0);};
  app.appendChild(again);
  var copy=el("button",null,"Copy my answers");copy.className="plain";copy.style.marginLeft=".5rem";
  copy.onclick=function(){
    var txt="Prakriti result — scored "+N+" of "+Q.length+" ("+skipped+" skipped). Vata "+c.v+" ("+pct(c.v)+"%), Pitta "+c.p+" ("+pct(c.p)+"%), Kapha "+c.k+" ("+pct(c.k)+"%). By question: "+ans.map(function(a,n){return (n+1)+":"+(a===null?"skip":NAME[a]);}).join(", ");
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){copy.textContent="Copied";},function(){window.prompt("Copy this:",txt);});}
    else{window.prompt("Copy this:",txt);}
  };
  app.appendChild(copy);
  var ft=el("p",null,"This names a pattern, it does not diagnose anything. If something following from it would mean changing medication, ignoring a symptom, or cutting out a food group, ask a doctor first.");
  ft.className="foot";
  app.appendChild(ft);
  window.scrollTo(0,0);
}
intro();
</script>
